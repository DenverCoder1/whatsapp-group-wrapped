; Custom PHP settings for WhatsApp Group Wrapped
; These settings allow larger file uploads and longer processing times
; Note: Vercel Hobby plan has 4.5MB body limit, Pro plan supports higher limits
; For local development, these limits are more generous

upload_max_filesize = 50M
post_max_size = 50M
max_execution_time = 120
max_input_time = 120
memory_limit = 512M
